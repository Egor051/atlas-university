# Contest demo deployment. Copy .env.example to .env and set your domain/password.
name: atlas-campus
services:
  web:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${WEB_WORKERS:-2}", "--proxy-headers", "--forwarded-allow-ips", "172.30.60.10", "--limit-concurrency", "100", "--timeout-keep-alive", "5"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://atlas_app:${ATLAS_APP_PASSWORD:?set_app_password}@db:5432/atlas
      APP_ENV: production
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://${DOMAIN:?set_domain}
      ALLOWED_HOSTS: ${DOMAIN:?set_domain}
      TZ: Europe/Moscow
    networks:
      proxy: {}
      data: {}
  db:
    # Official PostgreSQL 17.11; immutable multi-platform index.
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    shm_size: 128mb
    pids_limit: 128
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_password}
      ATLAS_APP_PASSWORD: ${ATLAS_APP_PASSWORD:?set_app_password}
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-atlas-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_admin -d atlas"]
      interval: 5s
      retries: 12
      timeout: 3s
    networks: [data]
  caddy:
    # Official Caddy 2.11.9; immutable multi-platform index.
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    read_only: true
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      start_period: 5s
      retries: 3
    environment:
      DOMAIN: ${DOMAIN:?set_domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: 172.30.60.10
networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.60.0/24
  data:
    internal: true
volumes:
  atlas_pgdata: {}
  caddy_data: {}
  caddy_config: {}
