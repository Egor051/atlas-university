name: Public HTTPS readiness
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  public-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Three certificate-verified samples of the public service
        run: python3 scripts/improvement_monitor.py --url https://atlas-university.ru --checks 3 --interval 10 --report "$RUNNER_TEMP/public-readiness.json"
      - name: Show the measured interval
        if: always()
        run: cat "$RUNNER_TEMP/public-readiness.json"
