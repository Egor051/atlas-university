name: Acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-dev.txt -c requirements-runtime.lock
      - run: python -m pip install -r docs/requirements-report.txt
      - run: npm ci --ignore-scripts
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/
        env:
          ATLAS_RUN_BROWSER_TESTS: '1'
      - run: npm run check
      - run: python scripts/browser_check.py
      - run: python scripts/accessibility_check.py
      - run: python scripts/extension_browser_check.py

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Resolve the Linux production runtime separately
        run: |
          python -m venv "$RUNNER_TEMP/atlas-runtime"
          "$RUNNER_TEMP/atlas-runtime/bin/python" -m pip install --disable-pip-version-check --upgrade pip==26.2.2
          "$RUNNER_TEMP/atlas-runtime/bin/python" -m pip install --disable-pip-version-check -r requirements.txt -c requirements-runtime.lock
          "$RUNNER_TEMP/atlas-runtime/bin/python" -m pip check
          "$RUNNER_TEMP/atlas-runtime/bin/python" -m pip freeze --all > "$RUNNER_TEMP/atlas-runtime-scan.txt"
      - name: Install the scanner in its own environment
        id: scanner
        run: |
          python -m venv "$RUNNER_TEMP/atlas-auditor"
          "$RUNNER_TEMP/atlas-auditor/bin/python" -m pip install --disable-pip-version-check --upgrade pip==26.2.2
          "$RUNNER_TEMP/atlas-auditor/bin/python" -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: PyPI known-advisory gate
        if: ${{ !cancelled() && steps.scanner.outcome == 'success' }}
        run: >-
          "$RUNNER_TEMP/atlas-auditor/bin/python" -m pip_audit
          -r "$RUNNER_TEMP/atlas-runtime-scan.txt" --no-deps --disable-pip
          -s pypi --progress-spinner off -f json -o "$RUNNER_TEMP/atlas-pypi-audit.json"
      - name: OSV known-advisory gate
        if: ${{ !cancelled() && steps.scanner.outcome == 'success' }}
        run: >-
          "$RUNNER_TEMP/atlas-auditor/bin/python" -m pip_audit
          -r "$RUNNER_TEMP/atlas-runtime-scan.txt" --no-deps --disable-pip
          -s osv --progress-spinner off -f json -o "$RUNNER_TEMP/atlas-osv-audit.json"

  postgres-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Current source, PostgreSQL, real TLS, races and full backup restoration
        run: python scripts/improvement_deployment.py

  extended-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-dev.txt -c requirements-runtime.lock
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: SELECT growth on larger synthetic fixtures
        run: python scripts/improvement_sql.py
      - name: Bounded real HTTP load
        run: python scripts/improvement_load.py
      - name: Declared cold mobile and desktop lab performance
        run: python scripts/improvement_performance.py --runs 3
      - name: Firefox and WebKit actual browser workflows
        run: python scripts/improvement_crossbrowser.py
